name: Importar CSVs históricos no Supabase

on:
  push:
    branches:
      - main
    paths:
      - "results/*.csv"
      - "results/**/*.csv"
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    name: Importar e manter janela de sete dias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Psycopg
        run: python -m pip install "psycopg[binary]==3.3.6"

      - name: Importar e remover dados antigos do Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/import_results.py

      - name: Remover CSVs anteriores à janela e enviar alterações
        shell: bash
        run: |
          cutoff="$(TZ=America/Sao_Paulo date -d '6 days ago' +%F)"
          today="$(TZ=America/Sao_Paulo date +%F)"
          shopt -s nullglob
          for file in results/clima_eventos_*.csv; do
            day="${file##*clima_eventos_}"
            day="${day%.csv}"
            if [[ ! "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ "$day" < "$cutoff" ]] || [[ "$day" > "$today" ]]; then
              rm -- "$file"
            fi
          done
          if [[ -n "$(git status --porcelain -- results)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results
            git commit -m "Maintain seven-day climate CSV window"
            git push
          fi
